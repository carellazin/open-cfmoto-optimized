name: Build APK (perf)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already ships the Android SDK ($ANDROID_HOME). Just accept licenses so
      # AGP can auto-install the exact platform/build-tools this project needs.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # Persistent signing key (recommended): add repository secrets
      #   SIGNING_KEYSTORE_B64   base64 of the .jks/.p12 file
      #   SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
      # Without them a throwaway key is generated, and each new build must be installed after
      # uninstalling the previous one (Android refuses an update signed with a different key).
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_STORE_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "SIGNING_STORE_PASSWORD=$KS_STORE_PW"
              echo "SIGNING_KEY_ALIAS=$KS_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KS_KEY_PW"
            } >> "$GITHUB_ENV"
            echo "Using persistent signing key from secrets."
          else
            echo "::warning::No SIGNING_KEYSTORE_B64 secret — using a throwaway key for this build."
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK (arm64)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/OpenCfMoto-perf-arm64.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCfMoto-perf-apk
          path: out/*.apk
          if-no-files-found: error
